
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist | Abraham's Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            ABRAHAM'S <span>VAULT</span><i>.</i>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#trending">Discover</a>
            <a href="index.html#popular">Collection</a>
            <a href="my-list.html" class="active">My Watchlist</a>
        </nav>
    </header>

    <main class="section" id="watchlist-page">
        <h1>My Watchlist</h1>
        <p>Your personal collection of films.</p>
        <p id="watchlist-status" role="status"></p>
        <div class="movie-grid" id="saved-movies-grid"></div>
    </main>
    <script src="top5.js"></script>
    <script src="watchlist.js"></script>
    <script src="navbar.js"></script>



<script>
    document.addEventListener("DOMContentLoaded", () => {
        const backButton = document.createElement("button");
        backButton.type = "button";
        backButton.className = "vault-back-btn";
        backButton.textContent = "← Back";

        backButton.addEventListener("click", () => {
            if (window.history.length > 1 && document.referrer) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        });

        const main = document.querySelector("main");
        if (main) {
            main.prepend(backButton);
        }
    });
</script>


</body>
</html>
