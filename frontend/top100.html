
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 100 Movies | Abraham's Vault</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top100-page {
            max-width: 1400px;
            margin: auto;
            padding: 45px 5%;
            color: #f4f1eb;
        }

        .top100-heading {
            margin-bottom: 10px;
            font-size: clamp(32px, 5vw, 52px);
        }

        .top100-subtitle {
            color: #aaa;
            margin-bottom: 32px;
            line-height: 1.7;
        }

        .top100-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 24px 18px;
        }

        .top100-card {
            min-width: 0;
            position: relative;
            background: #171719;
            border: 1px solid #303034;
            border-radius: 10px;
            overflow: hidden;
            transition: transform .2s, border-color .2s;
        }

        .top100-card:hover {
            transform: translateY(-5px);
            border-color: #ffb547;
        }

        .top100-poster-link {
            display: block;
            position: relative;
            aspect-ratio: 2 / 3;
            background: #242428;
        }

        .top100-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .top100-rank {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 7px 10px;
            border-radius: 5px;
            background: #ffb547;
            color: #111;
            font-weight: 800;
        }

        .top100-info {
            padding: 13px;
        }

        .top100-title {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            min-height: 2.9em;
            color: #f4f1eb;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 8px;
}

        .top100-title:hover {
            color: #ffb547;
        }

        .top100-meta {
            color: #b4b4bb;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .top100-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .top100-details {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 9px 5px;
            border-radius: 5px;
            background: #29292e;
            color: #fff;
            font-size: 12px;
        }

        .top100-details:hover {
            background: #38383f;
        }

        .top100-list-button {
            min-width: 38px;
            min-height: 36px;
            border: 1px solid #48484e;
            border-radius: 5px;
            background: transparent;
            color: #ffb547;
            font-size: 19px;
            cursor: pointer;
        }

        .top100-list-button.saved {
            background: #ffb547;
            color: #111;
        }

        .top100-status {
            color: #c5c5ca;
            margin: 24px 0;
        }

        .top100-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 35px;
        }

        .top100-pagination button {
            border: 0;
            border-radius: 5px;
            padding: 11px 18px;
            background: #ffb547;
            color: #111;
            font-weight: 700;
            cursor: pointer;
        }

        .top100-pagination button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        @media (max-width: 1000px) {
            .top100-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .top100-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px 12px;
            }

            .top100-page {
                padding: 30px 4%;
            }
        }

        @media (min-width: 701px) and (max-width: 850px) {
            .top100-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="top100-page">
        <p class="cinema-eyebrow">ABRAHAM'S VAULT COLLECTION</p>
        <h1 class="top100-heading">Top 100 Movies<span style="color:#ffb547">.</span></h1>
        <p class="top100-subtitle">
            One hundred highly rated films worth discovering.
            Explore the rankings, save favourites, and find your next watch.
        </p>

        <p class="top100-status" id="top100-status" role="status">
            Loading the rankings...
        </p>

        <section class="top100-grid" id="top100-grid"
                 aria-label="Top rated movies"></section>

        <div class="top100-pagination">
            <button type="button" id="top100-prev" disabled>← Previous</button>
            <span id="top100-page-label">Page 1 of 5</span>
            <button type="button" id="top100-next">Next →</button>
        </div>
    </main>

    <script src="top100.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
