
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Abraham's Vault</title>

    <style>
   
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(ellipse at top, #21190f 0%, #100e0c 42%, #080808 80%);
        color: #fff;
    }

    .signup-container {
        width: 100%;
        max-width: 460px;
        padding: 35px 32px;
        background: #151517;
        border: 1px solid #2b2b30;
        border-radius: 19px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
    }

    .logo {
        text-align: center;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.3px;
        margin-bottom: 9px;
    }

    .logo span {
        color: #ffb844;
    }

    .subtitle {
        text-align: center;
        color: #a5a5ad;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    .form-group {
        margin-bottom: 19px;
    }

    label {
        display: block;
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 600;
        color: #f0f0f2;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #303036;
        border-radius: 9px;
        background: #0e0e10;
        color: #fff;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
        color: #777783;
    }

    input:focus {
        border-color: #ffb844;
        box-shadow: 0 0 0 3px rgba(255, 184, 68, 0.10);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 65px;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 6px;
        color: #ffb844;
    }

    .toggle-password:hover {
        color: #ffd080;
    }

    .toggle-password:focus-visible {
        outline: 2px solid #ffb844;
        border-radius: 4px;
    }

    .signup-button {
        width: 100%;
        padding: 15px;
        margin-top: 2px;
        border: none;
        border-radius: 9px;
        background: #ffb844;
        color: #15110a;
        font-size: 16px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    .signup-button:hover {
        background: #ffc45f;
        transform: translateY(-1px);
    }

    .signup-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
    }

    .message {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .message.success {
        display: block;
        color: #9ce6ad;
        background: #142219;
        border: 1px solid #315a3b;
    }

    .message.error {
        display: block;
        color: #ffaaaa;
        background: #281515;
        border: 1px solid #653333;
    }

    .login-link {
        margin-top: 24px;
        text-align: center;
        color: #a5a5ad;
        font-size: 14px;
        line-height: 1.7;
    }

    a {
        color: #ffb844;
        text-decoration: none;
        transition: color 0.2s;
    }

    a:hover {
        color: #ffd080;
        text-decoration: underline;
    }

    .back-link {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: #a5a5ad;
        font-size: 13px;
    }

    .back-link:hover {
        color: #ffb844;
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 14px;
        }

        .signup-container {
            padding: 28px 20px;
        }

        .logo {
            font-size: 25px;
        }
    }
</style>

    </style>
</head>

<body>

    <main class="signup-container">
        <div class="logo">ABRAHAM'S <span>VAULT</span></div>
        <p class="subtitle">Create your account and enter your vault.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="254"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                    >👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Show confirm password"
                        aria-pressed="false"
                    >👁️</button>
                </div>
            </div>

            <button type="submit" class="signup-button" id="signupButton">
                Create Account
            </button>

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

        <a class="back-link" href="index.html">
            ← Back to Abraham's Vault
        </a>
    </main>

    <script>
        const API_URL = "https://abrahams-vault-backend.onrender.com/api/auth/register";

        const signupForm = document.getElementById("signupForm");
        const signupButton = document.getElementById("signupButton");
        const message = document.getElementById("message");

        // Show or hide either password field.
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const showPassword = input.type === "password";

                input.type = showPassword ? "text" : "password";
                button.textContent = showPassword ? "🙈" : "👁️";
                button.setAttribute("aria-pressed", String(showPassword));
                button.setAttribute(
                    "aria-label",
                    showPassword ? "Hide password" : "Show password"
                );
            });
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        signupForm.addEventListener("submit", async event => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (username.length < 3) {
                showMessage(
                    "Username must contain at least 3 characters.",
                    "error"
                );
                return;
            }

            if (password.length < 8 || password.length > 72) {
                showMessage(
                    "Password must be between 8 and 72 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = "Creating Account...";
            message.className = "message";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to create your account."
                    );
                }

                showMessage(
                    "Account created successfully! You can now log in.",
                    "success"
                );

                signupForm.reset();

                document.querySelectorAll(".toggle-password").forEach(button => {
                    button.textContent = "👁️";
                    button.setAttribute("aria-pressed", "false");
                    button.setAttribute(
                        "aria-label",
                        button.dataset.target === "password"
                            ? "Show password"
                            : "Show confirm password"
                    );
                });

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                showMessage(
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the server. Make sure your backend is running."
                        : error.message,
                    "error"
                );
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
